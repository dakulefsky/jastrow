name: Validate community dictionary code
on:
  pull_request:
    paths:
      - 'community/**'
      - 'plugin/community.js'
      - 'plugin/mesores.js'
      - 'hebrew/plugin/mesores.js'
      - 'community/test_mesores.mjs'
      - 'hebrew/plugin/community.js'
      - 'plugin/app.js'
      - 'plugin/quick-lookup.js'
      - 'plugin/availability.js'
      - 'hebrew/plugin/app.js'
      - 'hebrew/plugin/quick-lookup.js'
      - 'hebrew/plugin/availability.js'
      - 'plugin/index.html'
      - 'plugin/style.css'
      - 'hebrew/plugin/index.html'
      - 'hebrew/plugin/style.css'
      - 'plugin/manifest.json'
      - 'hebrew/plugin/manifest.json'
  push:
    branches: [community-dictionary-voting]
    paths:
      - 'community/**'
      - 'plugin/community.js'
      - 'plugin/mesores.js'
      - 'hebrew/plugin/mesores.js'
      - 'community/test_mesores.mjs'
      - 'hebrew/plugin/community.js'
      - 'plugin/app.js'
      - 'plugin/quick-lookup.js'
      - 'plugin/availability.js'
      - 'hebrew/plugin/app.js'
      - 'hebrew/plugin/quick-lookup.js'
      - 'hebrew/plugin/availability.js'
      - 'plugin/index.html'
      - 'hebrew/plugin/index.html'
      - 'plugin/manifest.json'
      - 'hebrew/plugin/manifest.json'
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check JavaScript syntax
        run: |
          node --check plugin/community.js
          node --check plugin/mesores.js
          node --check hebrew/plugin/mesores.js
          node community/test_mesores.mjs
          node --check hebrew/plugin/community.js
          node --check plugin/quick-lookup.js
          node --check hebrew/plugin/quick-lookup.js
          node --check plugin/app.js
          node --check hebrew/plugin/app.js
          node --check plugin/availability.js
          node --check hebrew/plugin/availability.js
          node --input-type=module --check < community/worker/src/index.js
          node community/test_worker.mjs
          node community/test_client.mjs
          node community/test_context_menu.mjs
      - name: Check community styles use Otzaria design tokens
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ("plugin/style.css", "hebrew/plugin/style.css"):
              css = Path(name).read_text(encoding="utf-8")
              assert "var(--color-outline, #888)" not in css, name
              assert "border-radius:999px" not in css, name
          PY
      - name: Validate exact HTTPS network allowlists
        run: |
          python - <<'PY'
          import json
          expected = ["https://otzaria-dictionary-community.dakulefsky.workers.dev"]
          for path in ("plugin/manifest.json", "hebrew/plugin/manifest.json"):
              with open(path, encoding="utf-8") as f:
                  manifest = json.load(f)
              assert manifest["network"]["enabled"] is True, path
              assert manifest["network"]["allowlist"] == expected, path
          PY
      - name: Check cross-link generator syntax
        run: |
          python -m py_compile community/build_entry_links.py
          python community/build_entry_links.py
          test -s community/entry-links.sql
          grep -q '^DELETE FROM entry_links;' community/entry-links.sql
