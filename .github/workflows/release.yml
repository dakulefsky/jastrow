name: Validate and publish Jastrow

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jastrow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check dictionary and selection lookup
        run: |
          python3 build_phrases.py
          node test_search.cjs
          node test_context.cjs
          node test_ranking.cjs
          node test_krupnik.cjs
          node test_consistency.cjs
          node test_phrases.cjs
      - name: Test consistent student lookup in Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node test_consistency_ui.cjs
      - name: Validate, build, and publish
        id: publish
        uses: Otzaria/otzaria-plugin-validator@v1
        with:
          path: plugin
          build: 'true'
          screenshots: screenshots/store-emblem.png
          update-screenshots: 'true'
          otzaria-user: ${{ secrets.OTZARIA_USER }}
          otzaria-password: ${{ secrets.OTZARIA_PASSWORD }}
      - name: Update the separate store card icon
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          OTZARIA_USER: ${{ secrets.OTZARIA_USER }}
          OTZARIA_PASSWORD: ${{ secrets.OTZARIA_PASSWORD }}
        run: node sync_store_icon.cjs
      - name: Save installable plugin
        if: steps.publish.outputs.plugin-file != ''
        uses: actions/upload-artifact@v4
        with:
          name: Jastrow-plugin
          path: ${{ steps.publish.outputs.plugin-file }}
          if-no-files-found: error
