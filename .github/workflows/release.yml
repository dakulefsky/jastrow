name: Validate and publish Jastrow

on:
  push:
    branches: [main, student-unified-results]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jastrow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      hebrew: ${{ steps.scope.outputs.hebrew }}
      english: ${{ steps.scope.outputs.english }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        name: Detect changes to the separate Hebrew plugin
        shell: python
        run: |
          import json, os, subprocess
          with open(os.environ['GITHUB_EVENT_PATH']) as f:
              event = json.load(f)
          kind = os.environ['GITHUB_EVENT_NAME']
          if kind == 'workflow_dispatch':
              changed = True
              english_changed = True
          else:
              if kind == 'pull_request':
                  before, after = event['pull_request']['base']['sha'], event['pull_request']['head']['sha']
              else:
                  before, after = event['before'], event['after']
              if before == '0' * 40:
                  paths = ['all']
              else:
                  paths = subprocess.check_output(['git', 'diff', '--name-only', before, after], text=True).splitlines()
              changed = before == '0' * 40 or any(p.startswith('hebrew/') for p in paths)
              hebrew_support = {'scripts/build_sefaria_bavli_hebrew_corpus.py', 'scripts/test_build_sefaria_bavli_hebrew_corpus.py', '.github/workflows/release.yml'}
              # Every PR runs the English regression suite as well, so Hebrew-only changes cannot silently regress shared behavior.
              english_changed = kind == 'pull_request' or before == '0' * 40 or any(not p.startswith('hebrew/') and p not in hebrew_support for p in paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('hebrew=' + str(changed).lower() + '\n')
              f.write('english=' + str(english_changed).lower() + '\n')
  release:
    needs: changes
    if: needs.changes.outputs.english == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build and stage the complete offline English Bavli
        run: |
          python scripts/build_sefaria_bavli_corpus.py --output /tmp/sefaria-bavli-english.zip
          mkdir -p plugin/data/sefaria-bavli hebrew/plugin/data
          unzip -q /tmp/sefaria-bavli-english.zip -d plugin/data/sefaria-bavli
          cp -a plugin/data/sefaria-bavli hebrew/plugin/data/
          node plugin/test_sefaria_bavli_data.cjs
          node plugin/test_sefaria_bavli_integration.cjs
      - name: Check dictionary and selection lookup
        run: |
          python3 build_phrases.py
          python3 build_inflections.py
          node test_search.cjs
          node test_prefixes.cjs
          node test_inflections.cjs
          node test_context.cjs
          node test_ranking.cjs
          node test_krupnik.cjs
          node test_consistency.cjs
          node test_phrases.cjs
          node test_unified.cjs
          node test_quick.cjs
          node plugin/test_recommendation_refresh.cjs
          node test_mesorat_context.cjs
          node --check plugin/mesores.js
          node --check hebrew/plugin/mesores.js
          node --check plugin/sefaria-offline.js
          node --check hebrew/plugin/sefaria-offline.js
          node --check plugin/sefaria-evidence.js
          node plugin/test_sefaria_offline.cjs
          node plugin/test_translation_prefetch.cjs
          node plugin/test_sefaria_evidence.cjs
          node plugin/test_translation_evidence.cjs
      - name: Install Chromium test dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test dictionary consistency in Chromium
        run: node test_consistency_ui.cjs
      - name: Test prefix and inflection lookups in Chromium
        run: node test_prefixes_ui.cjs
      - name: Test native reader submenu in Chromium
        run: node test_reader_lookup.cjs
      - name: Test redirect handling in Chromium
        run: node test_redirects_ui.cjs
      - name: Test unified dictionary UI in Chromium
        run: node test_unified_ui.cjs
      - name: Test cold-start native submenu in Chromium
        run: node test_context_open.cjs
      - name: Validate, build, and publish
        if: github.ref == 'refs/heads/main'
        id: publish
        uses: Otzaria/otzaria-plugin-validator@v1
        with:
          path: plugin
          build: 'true'
          screenshots: screenshots/store-emblem.png
          update-screenshots: 'true'
          otzaria-user: ${{ secrets.OTZARIA_USER }}
          otzaria-password: ${{ secrets.OTZARIA_PASSWORD }}
      - name: Update the separate store card icon
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          OTZARIA_USER: ${{ secrets.OTZARIA_USER }}
          OTZARIA_PASSWORD: ${{ secrets.OTZARIA_PASSWORD }}
        run: node sync_store_icon.cjs
      - name: Save installable plugin
        if: steps.publish.outputs.plugin-file != ''
        uses: actions/upload-artifact@v4
        with:
          name: Jastrow-plugin
          path: ${{ steps.publish.outputs.plugin-file }}
          if-no-files-found: error

  hebrew-release:
    needs: changes
    if: needs.changes.outputs.hebrew == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Test Hebrew Steinsaltz corpus builder
        run: python scripts/test_build_sefaria_bavli_hebrew_corpus.py
      - name: Build and stage the complete offline Hebrew Steinsaltz Bavli
        run: |
          python scripts/build_sefaria_bavli_hebrew_corpus.py --output /tmp/sefaria-bavli-hebrew.zip
          mkdir -p hebrew/plugin/data/sefaria-bavli
          unzip -q /tmp/sefaria-bavli-hebrew.zip -d hebrew/plugin/data/sefaria-bavli
      - name: Build Hebrew source data
        run: |
          python3 -c "import gzip,pathlib; p=pathlib.Path('hebrew/source.json.gz'); p.with_suffix('').write_bytes(gzip.decompress(p.read_bytes()))"
          python3 hebrew/build.py
          node hebrew/test.cjs
          node hebrew/test_host.cjs
          node hebrew/test_quick.cjs
          node hebrew/test_recommendation_refresh.cjs
          node --check hebrew/plugin/quick-lookup.js
          node --check hebrew/plugin/translation-prefetch.js
          node --check hebrew/plugin/sefaria-offline.js
          node --check hebrew/plugin/sefaria-evidence.js
      - name: Check Hebrew interface in Chromium
        env:
          HEBREW_STORE_SCREENSHOT: hebrew-store.png
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node hebrew/test_browser.cjs
      - name: Validate and publish Hebrew dictionary
        if: github.ref == 'refs/heads/main'
        id: hebrew
        uses: Otzaria/otzaria-plugin-validator@v1
        with:
          path: hebrew/plugin
          build: 'true'
          screenshots: hebrew-store.png
          reports-consent: 'true'
          otzaria-user: ${{ secrets.OTZARIA_USER }}
          otzaria-password: ${{ secrets.OTZARIA_PASSWORD }}
      - name: Update Hebrew store card icon and long description
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          OTZARIA_USER: ${{ secrets.OTZARIA_USER }}
          OTZARIA_PASSWORD: ${{ secrets.OTZARIA_PASSWORD }}
        run: node hebrew/sync_store_icon.cjs
      - uses: actions/upload-artifact@v4
        if: steps.hebrew.outputs.plugin-file != ''
        with:
          name: Hebrew-dictionary-plugin
          path: ${{ steps.hebrew.outputs.plugin-file }}
