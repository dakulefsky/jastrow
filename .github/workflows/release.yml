name: Validate and publish Jastrow

on:
  push:
    branches: [main, student-unified-results]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jastrow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check dictionary and selection lookup
        run: |
          python3 build_phrases.py
          python3 build_inflections.py
          node test_search.cjs
          node test_prefixes.cjs
          node test_inflections.cjs
          node test_context.cjs
          node test_ranking.cjs
          node test_krupnik.cjs
          node test_consistency.cjs
          node test_phrases.cjs
          node test_unified.cjs
          node test_quick.cjs
      - name: Test consistent student lookup in Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node test_consistency_ui.cjs
          node test_prefixes_ui.cjs
          node test_reader_lookup.cjs
          node test_redirects_ui.cjs
      - name: Validate, build, and publish
        if: github.ref == 'refs/heads/main'
        id: publish
        uses: Otzaria/otzaria-plugin-validator@v1
        with:
          path: plugin
          build: 'true'
          screenshots: screenshots/store-emblem.png
          update-screenshots: 'true'
          otzaria-user: ${{ secrets.OTZARIA_USER }}
          otzaria-password: ${{ secrets.OTZARIA_PASSWORD }}
      - name: Update the separate store card icon
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          OTZARIA_USER: ${{ secrets.OTZARIA_USER }}
          OTZARIA_PASSWORD: ${{ secrets.OTZARIA_PASSWORD }}
        run: node sync_store_icon.cjs
      - name: Save installable plugin
        if: steps.publish.outputs.plugin-file != ''
        uses: actions/upload-artifact@v4
        with:
          name: Jastrow-plugin
          path: ${{ steps.publish.outputs.plugin-file }}
          if-no-files-found: error

  hebrew-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Hebrew source data
        run: |
          python3 -c "import gzip,pathlib; p=pathlib.Path('hebrew/source.json.gz'); p.with_suffix('').write_bytes(gzip.decompress(p.read_bytes()))"
          python3 hebrew/build.py
          node hebrew/test.cjs
          node hebrew/test_host.cjs
          node hebrew/test_quick.cjs
      - name: Check Hebrew interface in Chromium
        env:
          HEBREW_STORE_SCREENSHOT: hebrew-store.png
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node hebrew/test_browser.cjs
      - name: Validate and publish Hebrew dictionary
        if: github.ref == 'refs/heads/main'
        id: hebrew
        uses: Otzaria/otzaria-plugin-validator@v1
        with:
          path: hebrew/plugin
          build: 'true'
          screenshots: hebrew-store.png
          reports-consent: 'true'
          otzaria-user: ${{ secrets.OTZARIA_USER }}
          otzaria-password: ${{ secrets.OTZARIA_PASSWORD }}
      - name: Update Hebrew store card icon
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          OTZARIA_USER: ${{ secrets.OTZARIA_USER }}
          OTZARIA_PASSWORD: ${{ secrets.OTZARIA_PASSWORD }}
        run: node hebrew/sync_store_icon.cjs
      - uses: actions/upload-artifact@v4
        if: steps.hebrew.outputs.plugin-file != ''
        with:
          name: Hebrew-dictionary-plugin
          path: ${{ steps.hebrew.outputs.plugin-file }}
